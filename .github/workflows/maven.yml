name: Java Unit Tests

on:
  push:
    branches: ["master", "main", "dev"]
  pull_request:
    branches: ["master", "main", "dev"]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    permissions:
      checks: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install extension dependencies
        run: npm ci
        working-directory: lsp

      - name: Format code
        id: format
        run: |
          mvn -q spotless:apply --file pom.xml
          npm run format --prefix lsp
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit formatting changes and defer to a fresh run
        if: steps.format.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/**/*.java' || true
          git add 'lsp/src/**/*.ts' || true
          git commit -m "Auto-format code"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

      - name: Run unit tests
        if: steps.format.outputs.changed != 'true'
        run: mvn -B test --file pom.xml

      - name: Build Mira and VS Code extension
        if: steps.format.outputs.changed != 'true'
        run: mvn -B -DskipTests -Pbuild-extension package --file pom.xml

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && steps.format.outputs.changed != 'true'
        with:
          files: target/surefire-reports/*.xml

      - name: Upload Surefire reports
        uses: actions/upload-artifact@v4
        if: failure() && steps.format.outputs.changed != 'true'
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
